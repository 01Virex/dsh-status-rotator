name: Test

on:
  push:
    branches: [main]
  pull_request:
  # 仓库启用 merge queue 后,"合并后的结果"会在落地前先跑一遍测试(需在仓库设置里开启)
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke tests
        run: npm test
