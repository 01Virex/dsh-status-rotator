name: Test

on:
  push:
    branches: [main]
  pull_request:
  # 仓库启用 merge queue 后,"合并后的结果"会在落地前先跑一遍测试(需在仓库设置里开启)
  merge_group:
  # star 刷新走 PR 时由机器人显式 dispatch(GITHUB_TOKEN 建的 PR 不会触发 pull_request 工作流)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke tests
        run: npm test

      # issue #51:设置必须在插件升级后存活。这份验证跑真实插件代码 + 真机形状的宿主替身,
      # 「包目录被整体替换」这一步冒烟测试覆盖不到,单独跑一遍。
      - name: Settings survive plugin upgrade (#51)
        run: node scripts/verify-settings-survive-upgrade.cjs

      # issue #92:外部词库送来的内容不能被当成「用户改动」冻进存储 / 镜像,
      # 否则 README 承诺的「把包从外部词库删掉即可回到设置页管理」不成立。
      - name: External bank ownership (#92)
        run: node scripts/verify-external-bank-ownership.cjs

      # 设置页抽成模块级工厂后,它能脱离 apply 单独实例化 / 渲染 / 卸载。
      # 这份验证同时守住「不再退回闭包捕获」——否则抽取会被无声改回去。
      - name: Settings page is independently testable
        run: node scripts/verify-settings-page.cjs

      # 选句引擎:E1 反重复(洗牌袋)+ E2 条件选词(when / rarity),
      # 外加「设置页行语法双向可逆」与 node 半边的校验 / 比较键。
      # 这些错了肉眼看不出来(少抽一句、条件句在错的时候出现、保存一次丢条件),单独钉住。
      - name: Phrase selection engine (anti-repeat + conditions)
        run: node scripts/verify-phrase-selection.cjs

  # 依赖真实 DOM 的部分(弹幕挂载、状态行锁宽、标签页标题所有权、每回合容器的内存泄漏)
  # 纯函数测不到,单独一档。GitHub 的 ubuntu 镜像自带 Google Chrome,运行器按
  # /usr/bin/google-chrome 自动挑(也可 --browser= 指定)。
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 运行器用 Node 内置的全局 WebSocket 连 CDP(Node 22+ 才有);主 test 档仍跑 Node 20,
      # 顺带覆盖较老的宿主运行时。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Danmaku / layout / settings-save / pending / title pages
        run: node scripts/run-danmaku-mount-test.cjs && node scripts/run-danmaku-mount-test.cjs --page=label && node scripts/run-danmaku-mount-test.cjs --page=settings && node scripts/run-danmaku-mount-test.cjs --page=pending && node scripts/run-danmaku-mount-test.cjs --page=title

      # E4 对外注册接口:一个真的第三方站在宿主上下文上接入,词库清空后状态行只可能
      # 显示第三方内容 —— 这条证明「不改本插件源码就能接进来」不是纸面约定。
      # E4 对外注册接口:一个真的第三方站在宿主上下文上接入,词库清空后状态行只可能
      # 显示第三方内容 —— 这条证明「不改本插件源码就能接进来」不是纸面约定。
      - name: Third-party registration API (E4)
        run: node scripts/run-danmaku-mount-test.cjs --page=external

      # V3 外观(字体/发光/动画/活动指示)与 V4 弹幕增强(悬停冻结、点击复制、按相位分色、
      # 自己发一条):类名、::before、指针交互都只有真浏览器 + 真 CSS 才成立。
      - name: Appearance themes (V3) + danmaku extras (V4)
        run: node scripts/run-danmaku-mount-test.cjs --page=appearance

      # 含 issue #87 的泄漏场景:连续 8 个回合后每回合的临时容器必须回落到开跑前的规模
      - name: 0.1.7 status line + turn-container leak (#87)
        run: node scripts/run-turn-process-test.cjs
