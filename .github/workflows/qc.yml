name: Plugin QC

# dsh-qc 质量检查(第三方工具,https://github.com/Herdeny/dsh-qc)。
# 静态预检秒级,动态验证会跑 pnpm install + 入口加载冒烟;失败不阻断 CI,
# 只把评分与证据链打到日志里,方便评审和榜单引用。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dsh-qc 的动态阶段直接 spawn("pnpm"),runner 上默认没有 pnpm → ENOENT;
      # 先装一个,动态验证(install / 构建 / 入口加载)才跑得起来。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: dsh-qc (static + dynamic)
        uses: Herdeny/dsh-qc@v1
        with:
          target: '.'
          command: check
          fail-on-fail: false
