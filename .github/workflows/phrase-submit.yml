name: 词库投稿机器人

# 两个职责:
#   A. 投稿处理:任何人在仓库开一个带「词库投稿」标签(或表单正文标记)的 Issue,
#      机器人就 校验 → 评论结果 + 试用 JSON → 自动开改动词库的 PR;
#   B. 合并清理:词库投稿 PR 被合并后,自动删除 phrase-bot/issue-N 分支并关闭投稿 Issue。
# GITHUB_TOKEN 写权限由 permissions 声明(仓库 Actions 设置需允许创建 PR,见 README)。

on:
  issues:
    types: [opened, reopened, labeled]
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: phrase-submit-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  phrase-bot:
    # A. 投稿(issues 事件):
    #    标签「词库投稿」命中 或 正文带表单标记「### 语种」(表单创建的 Issue 正文特征;
    #    注意 issue.form 字段只在表单创建那一下的 opened 事件里有,重开/补标签后没有);
    #    sender.type != Bot 防止机器人自己补标签时再次触发。
    # B. 清理(pull_request 事件):仅词库投稿分支(phrase-bot/issue-*)合并后触发;
    #    限定 head 仓库 = 本仓库,防止 fork PR 触发执行本仓库代码。
    if: >
      (github.event_name == 'issues' &&
        github.event.issue.pull_request == null &&
        github.event.sender.type != 'Bot' &&
        (contains(github.event.issue.labels.*.name, '词库投稿') || contains(github.event.issue.body, '### 语种')))
      || (github.event_name == 'pull_request' && github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'phrase-bot/issue-'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run phrase submission bot
        run: node scripts/phrase-bot.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
          REPO: ${{ github.repository }}
