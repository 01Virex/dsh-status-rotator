name: 词库投稿机器人

# 任何人在仓库开一个带「词库投稿」标签的 Issue(由 .github/ISSUE_TEMPLATE/phrase-submit.yml
# 表单自动打上),机器人就会: 校验 → 评论结果 + 试用 JSON → 自动开改动词库的 PR。
# 维护者点 Merge 即收录。注意 GITHUB_TOKEN 由 issues 事件派发,内容写权限由 permissions 声明。

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: phrase-submit-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  phrase-bot:
    # 触发条件(命中任一即可):
    #   A. Issue 带「词库投稿」标签(表单在标签已存在时会自动打;用户手动加标签也触发)
    #   B. 正文带表单标记「### 语种」(表单创建的 Issue 正文特征,不依赖标签/issue.form——
    #      注意 issue.form 字段只在表单创建那一下的 opened 事件里有,重开/补标签后没有)
    # sender.type != Bot 防止机器人自己补标签时再次触发,避免死循环
    if: github.event.issue.pull_request == null && github.event.sender.type != 'Bot' && (contains(github.event.issue.labels.*.name, '词库投稿') || contains(github.event.issue.body, '### 语种'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run phrase submission bot
        run: node scripts/phrase-bot.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
          REPO: ${{ github.repository }}
