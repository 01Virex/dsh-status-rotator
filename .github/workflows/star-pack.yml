name: Star packs

# 刷新两个 star 词库包(`star-ask` 纯求 star / `star-route` 星标者路由)。
#
# 为什么放在 Actions 里:GitHub 的 stargazers 接口需要认证,而且只有对本仓库有
# 访问权的令牌才读得到名单 —— Actions 自带的 GITHUB_TOKEN 正好满足,维护者不必
# 自备 PAT。想用别的令牌(例如组织级 PAT),把它存成仓库 secret `STAR_TOKEN` 即可,
# 下面的 `||` 会优先用它。
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/update-star-pack.cjs"
      - ".github/workflows/star-pack.yml"
  schedule:
    # 每周一 03:17 UTC:新星标者的名字当周就进词库
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write # 开 PR 并合并
  actions: write       # 显式 dispatch Test(见最后一步注释)

concurrency:
  group: star-pack
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh the star packs
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/update-star-pack.cjs

      # main 已开 required checks(`test`)与禁强推 / 禁删除 → 直推会被拒,所以走 PR。
      # ⚠️ GITHUB_TOKEN 建的 PR 不会触发 pull_request 工作流:不显式 dispatch 一次 Test,
      #    required check 永远不报,PR 会永远合不进去 —— 这条流程唯一容易踩的坑。
      - name: Open a PR and merge it once Test is green
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          FILES="config.example.json README.md README_ZH.md package.json lib/index.js"
          if git diff --quiet -- $FILES; then
            echo "star packs unchanged — nothing to commit"
            exit 0
          fi
          BRANCH="star-pack/refresh-$(date -u +%Y%m%d-%H%M)"
          git config user.name "dsh-status-rotator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add $FILES
          git commit -m "chore: 刷新 star 词库包(star-ask / star-route)"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore: 刷新 star 词库包(star-ask / star-route)" \
            --body "自动刷新(见 .github/workflows/star-pack.yml)。main 已开 required checks,所以走 PR:分支上跑一遍 Test,绿了自动合并。")
          echo "PR: $PR_URL"
          # GITHUB_TOKEN 建的 PR 不会触发 pull_request 工作流 → 显式触发一次 Test
          gh workflow run test.yml --ref "$BRANCH"
          for i in $(seq 1 60); do
            STATE=$(gh pr checks "$PR_URL" --json name,state -q '.[] | select(.name=="test") | .state' 2>/dev/null | head -1)
            echo "test: ${STATE:-pending}"
            case "$STATE" in
              SUCCESS|NEUTRAL|SKIPPED) break ;;
              FAILURE|CANCELLED|TIMED_OUT|STARTUP_FAILURE|ACTION_REQUIRED) echo "Test 未通过,不自动合并"; exit 1 ;;
            esac
            sleep 15
          done
          gh pr merge "$PR_URL" --squash --delete-branch || gh pr merge "$PR_URL" --merge --delete-branch
