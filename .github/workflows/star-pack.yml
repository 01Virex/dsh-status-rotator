name: Star packs

# 刷新两个 star 词库包(`star-ask` 纯求 star / `star-route` 星标者路由)。
#
# 为什么放在 Actions 里:GitHub 的 stargazers 接口需要认证,而且只有对本仓库有
# 访问权的令牌才读得到名单 —— Actions 自带的 GITHUB_TOKEN 正好满足,维护者不必
# 自备 PAT。想用别的令牌(例如组织级 PAT),把它存成仓库 secret `STAR_TOKEN` 即可,
# 下面的 `||` 会优先用它。
#
# 为什么只在 canonical 仓库跑:`GITHUB_TOKEN` 的作用域是「当前这个仓库」,在 fork 里
# 它读不到上游仓库的星标名单(接口返回 403,日志只会写「限额耗尽」,看着像偶发,
# 其实必然失败)——而 fork 每次同步上游 main 都会命中下面的 paths 触发它,于是
# 一片红。词库刷新本来就是上游仓库自己的事,fork 直接跳过(见 jobs.refresh.if)。
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/update-star-pack.cjs"
      - ".github/workflows/star-pack.yml"
  schedule:
    # 每周一 03:17 UTC:新星标者的名字当周就进词库
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write # 开 PR 并合并
  actions: write       # 显式 dispatch Test(见最后一步注释)

concurrency:
  group: star-pack
  cancel-in-progress: false

jobs:
  refresh:
    # 只在 canonical 仓库跑(fork / 镜像里一定拿不到星标名单,见文件头注释)。
    # 想在 fork 里也刷:配一个能读上游仓库的 secret `STAR_TOKEN`,再把这一行去掉。
    if: github.repository == '01Virex/dsh-status-rotator'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh the star packs
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/update-star-pack.cjs

      # main 已开 required checks(`test`)与禁强推 / 禁删除 → 直推会被拒,所以走 PR。
      # ⚠️ 坑(GITHUB_TOKEN 建的 PR):它的 `pull_request` run 会被 park 成
      #    `action_required`(等人工放行),于是 required check `test` 永远不 report,
      #    PR 永远合不进去 —— 2026-09-25 实测(run 36134477329):轮询 60×15s 全 pending,
      #    最后被 base branch policy 拒掉,留下卡住的 PR #67。当时"显式 dispatch 一次 Test"
      #    这一步也救不了:workflow_dispatch 的 run 虽然成功,但不计入 PR 的 required check。
      #    现在:① 先把 park 住的 run 批掉(actions: write);② 再补一次 dispatch 兜底;
      #    ③ 按 GitHub 自己的 mergeStateStatus 判断能不能合(不再猜 check 名字 / 取第一条)。
      #    想彻底绕开这套:配一个 PAT secret `STAR_TOKEN`(下面的 `||` 会优先用它,
      #    PR 由人建就正常触发 CI,不会被 park)。
      - name: Open a PR and merge it once Test is green
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          FILES="config.example.json README.md README_ZH.md package.json lib/index.js"
          if git diff --quiet -- $FILES; then
            echo "star packs unchanged — nothing to commit"
            exit 0
          fi
          BRANCH="star-pack/refresh-$(date -u +%Y%m%d-%H%M)"
          git config user.name "dsh-status-rotator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add $FILES
          git commit -m "chore: 刷新 star 词库包(star-ask / star-route)"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore: 刷新 star 词库包(star-ask / star-route)" \
            --body "自动刷新(见 .github/workflows/star-pack.yml)。main 已开 required checks,所以走 PR:分支上跑一遍 Test,绿了自动合并。")
          echo "PR: $PR_URL"

          # 批掉这个分支上被 park 的 pull_request run(不批它们就永远不 report required check)
          approve_parked() {
            gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --limit 20 \
              --json databaseId,event -q '.[] | select(.event=="pull_request") | .databaseId' |
            while read -r RUN; do
              [ -n "$RUN" ] || continue
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/approve" >/dev/null 2>&1; then
                echo "approved parked run $RUN"
              fi
            done
          }
          approve_parked
          gh workflow run test.yml --ref "$BRANCH" || true

          # 能合不能合,问 GitHub:mergeStateStatus。BLOCKED 之外的 CLEAN/UNSTABLE/HAS_HOOKS 都可合。
          MERGED=0
          for i in $(seq 1 40); do
            STATE=$(gh pr view "$PR_URL" --json mergeStateStatus -q .mergeStateStatus 2>/dev/null)
            FAILED=$(gh pr checks "$PR_URL" --json state -q '[.[] | select(.state=="FAILURE" or .state=="CANCELLED" or .state=="TIMED_OUT")] | length' 2>/dev/null)
            echo "mergeState=${STATE:-?} failed_checks=${FAILED:-0}"
            case "${FAILED:-0}" in ""|0) ;; *) echo "Test 未通过,不自动合并"; exit 1 ;; esac
            case "$STATE" in
              CLEAN|UNSTABLE|HAS_HOOKS)
                if gh pr merge "$PR_URL" --squash --delete-branch || gh pr merge "$PR_URL" --merge --delete-branch; then
                  echo "merged: $PR_URL"
                  MERGED=1
                fi
                break ;;
              DIRTY|BEHIND) gh pr update-branch "$PR_URL" >/dev/null 2>&1 || true ;;
            esac
            approve_parked
            sleep 15
          done
          if [ "$MERGED" != "1" ]; then
            gh pr comment "$PR_URL" --body "自动合并没成功:main 的 required check \`test\` 需要人工放行 —— bot(GITHUB_TOKEN)建的 PR,它的 \`pull_request\` run 会被 park 成 \`action_required\`。点那次 run 的 **Approve and run** 即可;或在仓库 secrets 里加一个 PAT \`STAR_TOKEN\`(工作流会自动优先用它,PR 由人建就不会被 park),下次起就全自动。" || true
            echo "::error::star 词库刷新 PR 已开好但没能自动合并:$PR_URL(需要人工放行 required check,或配 STAR_TOKEN)"
            exit 1
          fi
