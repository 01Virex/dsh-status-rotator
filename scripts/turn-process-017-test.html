<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>PENDING</title>
<!--
	dsh 0.1.7 状态行回归测试(dev-only,不随 npm 包发布)。

	要测的是两件事:
	  1. 位置 —— 0.1.7 把回合状态塞进了 button[data-turn-process](回合折叠头,
	     长在回合开头,长回合里早被滚出视口)。插件把状态行搬回 dsh ≤0.1.6 的位置:
	     对话下方、输入框正上方那一行(ChatView 里 ChatNodeList 之后渲染的 TurnStatus),
	     水平方向与消息列同一左边界。
	  2. 内容 —— 宿主每秒用 React setTextContent 把折叠头里的标签整段重写
	     ("Deep diving for 12s" / "深度求索中，用时12秒"),插件不往标签里塞东西,
	     只在旁边读它:时长原样搬进状态行时钟,回合结束后把折叠头放出来。

	页面复刻 0.1.7 的真实结构:
	  #scroll
	    ├─ #viewArea   对话流(第一条 flow 项是水平对齐基准)
	    └─ #seat       输入框座位(sticky;里面是 [data-slot=conversation.composer.bar])
	         └─ #card  输入卡片([data-composer-input])
	  外加隐藏读屏公告 span + button[data-turn-process] 折叠头。

	用法(任意 Chromium 内核浏览器,无头即可):
	  node scripts/run-turn-process-test.cjs [--browser=<path>] [--wait=4200]
	case=running / thinking / long / zh / finished / old-host
	结果写进 window.__RESULTS__ 与 #verdict。
-->
<style>
	:root {
		/* dsh 主题里的真实 token(0.1.6-alpha.2 与 0.1.7-rc.1 取值完全一致):
		   --dsw-font-s-strong-14 = "500 14px/22px <family>"  ← 字重是 500,不是 600
		   --dsw-font-xs-13       = "13px/20px <family>"
		   还原 0.1.6 观感必须按这两个值来,否则字重/字体族会偏。 */
		--dsw-font-family: system-ui, sans-serif;
		--dsw-font-s-strong-14: 500 14px/22px var(--dsw-font-family);
		--dsw-font-xs-13: 13px/20px var(--dsw-font-family);
		--dsh-content-font-size: 14px;
		--dsh-content-font-size-secondary: 13px;
		--dsh-content-font-delta: 0px;
		--dsh-content-font-delta-secondary: 0px;
		--dsw-static-deepseek-500: #4d6bfe;
		--dsw-static-deepseek-200: #b8c6ff;
		--dsw-alias-label-caption: #888;
	}
	html, body { height: 100%; margin: 0; background: #151517; color: #eee; font: 14px system-ui, sans-serif }
	#scroll { width: 1000px; height: 560px; display: flex; flex-direction: column; justify-content: flex-end; }
	#viewArea { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 40px 8px }
	.flowItem { padding: 6px 0; color: #bbb }
	/* 输入框座位:sticky 贴底,座位宽度 1000,输入卡片居中 640 宽(与线上同构) */
	#seat { position: sticky; bottom: 0; display: flex; flex-direction: column; flex: none; padding: 0 }
	#card { width: 640px; margin: 0 auto; border: 1px solid #333; border-radius: 12px; padding: 10px 14px; background: #1b1b1e }
	#composerInput { min-height: 24px; color: #667 }
	/* ↓ 逐字复刻 dsh 0.1.7-rc.1 的 TurnProcessNodeView.module.css(css$6,原文照抄) */
	.l_V-RG_root { box-sizing: border-box; width: 100%; min-width: 0; height: calc(33px + var(--dsh-content-font-delta, 0px)); border: none; border-bottom: .5px solid #333; color: #9aa; cursor: pointer; text-align: left; background: 0 0; align-items: center; padding: 0 0 8px; transition: color .1s; display: flex }
	.l_V-RG_root:disabled { cursor: default }
	.l_V-RG_root:not([data-open]) { margin-bottom: 8px }
	.l_V-RG_chevron { width: 14px; height: 14px; flex: none; margin-left: 4px }
	.l_V-RG_label { min-width: 0; font-size: var(--dsh-content-font-size-secondary, 13px); line-height: calc(24px + var(--dsh-content-font-delta, 0px)); text-overflow: ellipsis; white-space: nowrap; overflow: hidden }
	.TTCZqG_visuallyHidden { clip: rect(0 0 0 0); white-space: nowrap; width: 1px; height: 1px; position: absolute; overflow: hidden }
	/* ↓ 逐字照抄 dsh ≤0.1.6 的 .turnStatus / .turnStatusClock(ChatView module css,原文) */
	.EvIC1a_turnStatus { height: calc(26px + var(--dsh-content-font-delta, 0px)); font: var(--dsw-font-s-strong-14); font-size: var(--dsh-content-font-size, 14px); line-height: calc(22px + var(--dsh-content-font-delta, 0px)); white-space: nowrap; background: linear-gradient(90deg, var(--dsw-static-deepseek-500) 0%, var(--dsw-static-deepseek-500) 40%, var(--dsw-static-deepseek-200) 50%, var(--dsw-static-deepseek-500) 60%, var(--dsw-static-deepseek-500) 100%); color: #0000; -webkit-text-fill-color: transparent; background-position: 100% 0; background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; flex: none; align-self: flex-start; align-items: center; animation: 1.8s linear infinite EvIC1a_shimmer; display: inline-flex; margin-left: 40px }
	.EvIC1a_turnStatusClock { font: var(--dsw-font-xs-13); font-size: var(--dsh-content-font-size-secondary, 13px); line-height: calc(20px + var(--dsh-content-font-delta-secondary, 0px)); font-variant-numeric: tabular-nums; color: var(--dsw-alias-label-caption); -webkit-text-fill-color: var(--dsw-alias-label-caption); margin-left: 8px; font-weight: 400 }
	@keyframes EvIC1a_shimmer { to { background-position: 0 0 } }
	#verdict { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; background: #000; color: #0f0; font: 12px/1.5 monospace; padding: 4px; white-space: pre-wrap }
</style>
</head>
<body>
<div id="root">
	<div id="scroll">
		<div id="viewArea"><div class="flowItem" data-chat-flow-kind="user">你好</div></div>
		<!-- 座位外面那层 display:contents 容器:线上就有,对齐基准必须往上找 -->
		<div style="display:contents"><div id="seat"></div></div>
	</div>
</div>
<div id="verdict">PENDING</div>
<script>
	const params = new URLSearchParams(location.search);
	const testCase = params.get("case") || "running";

	const HOST_TEXT = {
		en: { plain: "Deep diving...", running: (d) => "Deep diving for " + d },
		zh: { plain: "深度求索中", running: (d) => "深度求索中，用时" + d },
	};
	const durationText = (locale, sec) => {
		const m = Math.floor(sec / 60), s = sec % 60;
		return m > 0 ? (locale === "zh" ? m + "分" + String(s).padStart(2, "0") + "秒" : m + "m " + String(s).padStart(2, "0") + "s")
			: (locale === "zh" ? sec + "秒" : sec + "s");
	};

	const SCENARIOS = {
		running: { locale: "en", startSec: 20, expectPhase: "running" },
		thinking: { locale: "en", startSec: 3, expectPhase: "thinking" },
		long: { locale: "en", startSec: 120, expectPhase: "long" },
		zh: { locale: "zh", startSec: 20, expectPhase: "running" },
		finished: { locale: "en", startSec: 20, expectPhase: "running", finishAfterMs: 2000 },
		"old-host": { locale: "en", startSec: 20, expectPhase: "running", legacy: true },
		// dsh 0.1.5-rc.2 实况:回合折叠头也在(但 label 是「N tool calls / 思考了一会儿」),
		// 运行中的状态行还是旧位置那个 role=status —— 插件必须只走旧路径
		"015-coexist": { locale: "en", startSec: 20, expectPhase: "running", legacy: true, summaryHeader: true },
		// 降级:折叠头在、输入框座位不在(布局变了 / 插件跑在非聊天页)——
		// 绝不能把宿主的运行中状态藏掉,顶多这拍不接管
		"no-seat": { locale: "en", startSec: 20, expectPhase: "running", noSeat: true },
		// 观测通道(discussion #3669):结构化重试事件 → 状态行上的徽标
		retry: { locale: "en", startSec: 20, expectPhase: "running", retry: true },
		"retry-old-host": { locale: "en", startSec: 20, expectPhase: "running", legacy: true, retry: true },
		// 降级:宿主没暴露会话事件窗口 → 不显示徽标、也绝不猜次数
		"no-events": { locale: "en", startSec: 20, expectPhase: "running", retry: true, noEvents: true },
		// ── dsh 0.1.7-rc.1 适配 ──────────────────────────────────────────────
		// rc.1 起「回合行」对**每个**回合都渲染(alpha 时代 !foldable 直接 return null):
		// canCollapse=false → button 带 disabled + data-open,没有 chevron,高度仍是 33px。
		// 插件必须照样接管(藏掉它、在输入框上方画自己的线)。
		"running-simple": { locale: "en", startSec: 20, expectPhase: "running", rcSimpleTurn: true },
		// ── deep diving 回归(0.1.6 观感)────────────────────────────────────
		// 没有文案来源(没 config.json / 没 phrases)→ 插件自己那条线必须回落宿主原文,
		// 不能再是一条空行(修复「deep diving 不见了」)。
		"no-phrases": { locale: "zh", startSec: 20, expectPhase: "running", noPhrases: true, hostTextOnly: true },
		// labelSource="host":纯 0.1.6 观感 —— 文案只有宿主原文,样式逐条等于 0.1.6 的
		// .turnStatus(页面里同时放一份原文参考元素,做 computed style 逐项比对),
		// 时钟也要按旧版 15 秒后才出现。
		"host-only": { locale: "en", startSec: 20, expectPhase: "running", labelSource: "host", hostTextOnly: true, reference196: true, clockGated: true },
		"host-only-clock": { locale: "en", startSec: 5, expectPhase: "running", labelSource: "host", hostTextOnly: true, reference196: true, clockGated: true },
	};
	const scenario = SCENARIOS[testCase] || SCENARIOS.running;
	const locale = scenario.locale;
	const hostText = HOST_TEXT[locale];

	// ══ 夹具:0.1.7 结构(折叠头 + 输入框座位)或旧宿主 ══
	let headerButton = null;   // button[data-turn-process]
	let reactLabelEl = null;   // React 管理的标签 —— 每秒被整段重写
	let seatEl = null;
	let rewriteCount = 0;
	const viewArea = document.getElementById("viewArea");

	if (scenario.legacy) {
		// 旧宿主:dsh ≤0.1.6 的 TurnStatus(role=status,自带 shimmer,时钟是 aria-hidden 子元素)
		viewArea.insertAdjacentHTML("beforeend",
			'<div class="EvIC1a_turnStatus" role="status" aria-live="polite">' + hostText.plain +
			'<span class="EvIC1a_turnStatusClock" aria-hidden="true">' + durationText(locale, scenario.startSec) + "</span></div>");
		if (scenario.summaryHeader) {
			// 0.1.5 里回合折叠头也在,但 label 是计数摘要("6 tool calls"),不是 deep diving
			const old = viewArea.querySelector(".EvIC1a_turnStatus");
			old.insertAdjacentHTML("beforebegin",
				'<button type="button" class="l_V-RG_root" data-turn-process="1" data-turn-process-messages="1" data-turn-process-tool-calls="6" data-turn-process-subagents="0">' +
				'<span class="l_V-RG_label">6 tool calls</span>' +
				'<svg class="l_V-RG_chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4L10 8L6 12" stroke="currentColor"/></svg>' +
				"</button>");
			headerButton = viewArea.querySelector("[data-turn-process]");
		}
	} else {
		viewArea.insertAdjacentHTML("beforeend",
			'<span id="announce" class="TTCZqG_visuallyHidden" role="status" aria-live="polite" aria-atomic="true">' + hostText.plain + "</span>" +
			// rc.1:data-open 在 !foldable 时恒为 true,且 canCollapse=false → disabled、无 chevron。
			// 两代 0.1.7 的按钮结构一致,差别只在这三个属性上(见 SCENARIOS 注释)。
			'<button type="button" id="turnProcess" class="l_V-RG_root"' +
			(scenario.rcSimpleTurn
				? ' data-open="true" data-turn-process="1" data-turn-process-messages="2" data-turn-process-tool-calls="0" data-turn-process-subagents="0" disabled'
				: ' data-turn-process="1" data-turn-process-messages="2"') +
			">" +
			'<span id="label" class="l_V-RG_label">' + hostText.running(durationText(locale, scenario.startSec)) + "</span>" +
			// chevron 与 dsh 真实图标一致:aria-hidden="true"(不能让它抢走时钟判定);
			// rc.1 里只有 canCollapse 时才渲染它
			(scenario.rcSimpleTurn ? "" : '<svg id="chevron" class="l_V-RG_chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6L8 10L12 6" stroke="currentColor"/></svg>') +
			"</button>");
		headerButton = document.getElementById("turnProcess");
		reactLabelEl = document.getElementById("label");
		if (scenario.reference196) {
			// 0.1.6 原文参考元素:与旧宿主那一份**逐字同构**(同一个 CSS 类、同样的文本与时钟),
			// 供断言把插件在 0.1.7 上画的那条线与它做 computed style 逐项比对。
			viewArea.insertAdjacentHTML("beforeend",
				'<div id="ref196" class="EvIC1a_turnStatus" role="status" aria-live="polite">' + hostText.plain +
				'<span class="EvIC1a_turnStatusClock" aria-hidden="true">' + durationText(locale, scenario.startSec) + "</span></div>");
		}
		if (scenario.noSeat) {
			// 降级场景:故意不建输入框座位(只留下折叠头)
			document.getElementById("seat").remove();
		} else {
			// 输入框座位:与线上同构 —— 座位(真盒子)外面套着 display:contents 的 slot 容器,
			// 座位里面那个 [data-slot=conversation.composer.bar] 也是 contents;
			// 对齐基准要往上找到含 flow 项的祖先(#scroll)才拿得到。
			document.getElementById("seat").innerHTML =
				'<div data-slot="conversation.composer.bar" style="display:contents">' +
				'<div id="card"><div id="composerInput" data-composer-input></div></div>' +
				"</div>";
			seatEl = document.getElementById("seat");
		}
	}

	/**
	 * 宿主心跳:完全按线上 React 的行为 —— 每次把标签元素的 textContent 整段重写
	 * (setTextContent),标签里原有的子节点都会被这次赋值抹掉。
	 */
	const mountedAt = Date.now();
	let finished = false;
	const hostTick = () => {
		const elapsed = scenario.startSec + Math.floor((Date.now() - mountedAt) / 1000);
		if (scenario.legacy) {
			const oc = viewArea.querySelector(".EvIC1a_turnStatusClock");
			if (elapsed >= 15 && oc) oc.textContent = durationText(locale, elapsed);
			return;
		}
		if (scenario.finishAfterMs !== undefined && Date.now() - mountedAt >= scenario.finishAfterMs && !finished) {
			finished = true;
			reactLabelEl.textContent = "Took " + durationText(locale, elapsed);
			rewriteCount++;
			setTimeout(hostTick, 1000);
			return;
		}
		if (!finished) {
			reactLabelEl.textContent = hostText.running(durationText(locale, elapsed));
			document.getElementById("announce").textContent = hostText.plain;
			rewriteCount++;
		}
		setTimeout(hostTick, 1000);
	};
	hostTick();

	// ══ 插件侧桩:localStorage 配置 + dsh locale 字典(0.1.7 真实键值) ══
	const PHRASES = { thinking: "THINKING-PHRASE…", running: "RUNNING-PHRASE…", long: "LONG-PHRASE…" };
	const DICTS = {
		en: { "chat.deepDiving": "Deep diving...", "message.turnProcess.deepDivingFor": "Deep diving for {duration}" },
		zh: { "chat.deepDiving": "深度求索中", "message.turnProcess.deepDivingFor": "深度求索中，用时{duration}" },
	};
	const seed = {
		config: {
			intervalMs: 1e6, typeSpeedMs: 0, liveTickMs: 1000, longAfterMs: 60000,
			gradient: { enabled: false }, title: { enabled: false }, danmaku: { enabled: false },
			// labelSource="host" = 纯 0.1.6 观感(不轮换短语,只写宿主原文)
			...(scenario.labelSource ? { labelSource: scenario.labelSource } : {}),
		},
		// noPhrases:完全不给文案来源(模拟「装了插件但没 config.json」)——
		// 插件自己那条线必须回落宿主原文,而不是留一条空行
		...scenario.noPhrases ? {} : {
			phrases: {
				zh: { thinking: [PHRASES.thinking], running: [PHRASES.running], long: [PHRASES.long] },
				en: { thinking: [PHRASES.thinking], running: [PHRASES.running], long: [PHRASES.long] },
			},
		},
	};
	Object.defineProperty(window, "localStorage", {
		configurable: true,
		value: {
			getItem: (k) => (k === "dsh-status-rotator.config" ? JSON.stringify(seed) : null),
			setItem: () => {}, removeItem: () => {},
		},
	});
	window.__RESULTS__ = [];
	const R = (name, pass, extra) => window.__RESULTS__.push({ name, pass: !!pass, extra: extra || "" });
	window.onerror = (msg, src, line) => { R("运行时异常", false, msg + " @" + line); };
	window.__ModuleLoader__ = {
		load(def) {
			const require = (n) => {
				if (n === "react") {
					return {
						useState: (init) => [typeof init === "function" ? init() : init, () => {}],
						useEffect: () => {}, useCallback: (fn) => fn,
						useRef: (init) => ({ current: init === undefined ? null : init }),
						createElement: (type, props, ...children) => ({ type, props: props || {}, children }),
					};
				}
				throw new Error("unexpected require: " + n);
			};
			window.__PLUGIN__ = def.factory(require);
		},
	};
</script>
<script src="../lib/client.js"></script>
<script>
	const translate = (key, p) => {
		let s = DICTS[locale][key];
		if (s === undefined) s = key;
		if (p) s = s.replace(/\{(\w+)\}/g, (m, n) => (n in p ? String(p[n]) : m));
		return s;
	};
	let settingsComponent = null;
	/**
	 * 观测通道夹具:假的 sessions 服务 + 会话事件窗口。
	 * 事件形状照抄 dsh:llm/retry 带 { retry, maxRetries, provider, delayMs, failure:{code} },
	 * llm/retry-started 标记开始跑,step/start 清空。scenario.noEvents 时不暴露 eventSource
	 * (模拟旧宿主)→ 插件必须静默降级。
	 */
	const retryWindow = { entries: [] };
	let retryNotify = null;
	const retryEvent = (type, data) => ({ type: "event", event: { type, seq: retryWindow.entries.length + 1, time: Date.now(), data } });
	if (scenario.retry) {
		retryWindow.entries.push(retryEvent("llm/retry", {
			retryId: "r1", turn: 1, step: 2, provider: "deepseek-official", mode: "normal",
			policyKey: "k", retry: 3, maxRetries: 5, delayMs: 2500,
			failure: { code: "sampling_error", message: "ECONNREFUSED https://api.internal.example/v1" },
		}));
	}
	const sessionsService = {
		list: { subscribe: () => () => {}, getSnapshot: () => ({ current: "s-test" }) },
		binding: () => ({
			sessionId: "s-test",
			session: { getSnapshot: () => ({ running: true, partial: { blocks: [] }, runningCalls: [] }), subscribe: () => () => {} },
			eventSource: scenario.noEvents ? undefined : {
				getSnapshot: () => ({ entries: retryWindow.entries, hasMore: false, revision: retryWindow.entries.length, change: { kind: "append", entries: [] } }),
				subscribe: (fn) => { retryNotify = fn; return () => { if (retryNotify === fn) retryNotify = null; }; },
			},
		}),
	};
	const ctx = {
		locale: {
			register: () => () => {},
			subscribe: () => () => {},
			getLocale: () => ({ active: locale }),
			bind: (ns) => (ns === "chat" ? (key, p) => translate(key, p) : null),
		},
		slots: {
			inject: (name, fn) => fn(),
			register: (def, comp) => { if (typeof comp === "function") settingsComponent = comp; return { dispose() {} }; },
		},
		effect: (cb) => cb(),
		get: (name) => (name === "sessions" ? sessionsService : undefined),
		on: () => {},
	};
	try {
		window.__PLUGIN__.apply(ctx);
		R("apply 不抛异常", true);
	} catch (error) {
		R("apply 不抛异常", false, String((error && error.stack) || error));
	}

	const $ = (sel) => document.querySelector(sel);
	const textOf = (sel) => { const el = $(sel); return el ? el.textContent : null; };
	const lineEl = () => document.querySelector(".dsh-status-rotator-line");
	const lineText = () => { const l = lineEl(); const s = l && l.querySelector(".dsh-status-rotator-text"); return s ? s.textContent : null; };
	/** 旧宿主(role=status)里本插件文案的当前文本 */
	const visiblePhraseOld = () => {
		const s = viewArea.querySelector(".EvIC1a_turnStatus > .dsh-status-rotator-text");
		return s ? s.textContent : null;
	};
	const lineClock = () => { const l = lineEl(); const c = l && l.querySelector(".dsh-status-rotator-clock"); return c ? c.textContent : null; };
	/** 时长文本 → 秒(dsh parseClock 同语义) */
	const secondsOf = (text) => {
		const s = String(text || "").trim();
		let m = s.match(/^(\d+)分(\d+)秒$/);
		if (m) return Number(m[1]) * 60 + Number(m[2]);
		m = s.match(/^(\d+)m\s*(\d+)s$/);
		if (m) return Number(m[1]) * 60 + Number(m[2]);
		m = s.match(/^(\d+)(秒|s)$/);
		return m ? Number(m[1]) : -1;
	};

	/** 观测通道场景的断言(新旧宿主共用):徽标出现 → 跟随事件窗口 → 清空;无事件流则降级 */
	const checkObservation = (phrase) => {
		const phraseShown = () => lineText() === phrase || visiblePhraseOld() === phrase;
	const badgeEl = () => document.querySelector(".dsh-status-rotator-badge");
	const badgeText = () => { const b = badgeEl(); return b ? b.textContent : null; };
	const badgeVisible = () => {
		const b = badgeEl();
		return !!b && b.textContent.length > 0 && getComputedStyle(b).display !== "none" && b.getBoundingClientRect().width > 0;
	};
	window.__RETRY_STEP__ = window.__RETRY_STEP__ || 0;
	const step = window.__RETRY_STEP__;

	if (scenario.noEvents) {
		// 降级:没有事件窗口 → 不显示徽标,状态行本身照常工作
		R("无事件窗口时不显示徽标(不猜次数)", !badgeVisible(), "badge=" + JSON.stringify(badgeText()));
		R("无事件窗口时状态行照常显示文案", lineText() === phrase || (visiblePhraseOld() === phrase),
			"line=" + lineText() + " old=" + visiblePhraseOld());
		finalize();
		return;
	}

	if (step === 0) {
		R("重试徽标出现且挂在时钟后面", badgeVisible() && badgeText() === "⟳ 3/5", "badge=" + JSON.stringify(badgeText()));
		R("徽标位置在时钟之后", (() => {
			const host = lineEl() || viewArea.querySelector(".EvIC1a_turnStatus");
			const b = badgeEl();
			const clock = host && Array.from(host.children).find((n) => n.getAttribute("aria-hidden") === "true");
			if (!b || !clock) return !!b;   // 旧宿主时钟 15 秒后才出现:只要求徽标在宿主里
			return (clock.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) !== 0;
		})());
		R("文案里没有 provider 原始报文(脱敏)", (() => {
			const b = badgeEl();
			return !!b && b.textContent.indexOf("api.internal.example") === -1 && b.textContent.indexOf("ECONNREFUSED") === -1;
		})(), "badge=" + JSON.stringify(badgeText()));
		// 推进:新一次重试 4/5
		retryWindow.entries.push(retryEvent("llm/retry", {
			retryId: "r1", turn: 1, step: 2, provider: "deepseek-official", mode: "normal",
			policyKey: "k", retry: 4, maxRetries: 5, delayMs: 1000, failure: { code: "timeout" },
		}));
		if (retryNotify) retryNotify();
		window.__RETRY_STEP__ = 1;
		finalize();
		return;
	}
	if (step === 1) {
		R("窗口更新后徽标跟着走(4/5)", badgeVisible() && badgeText() === "⟳ 4/5", "badge=" + JSON.stringify(badgeText()));
		// 推进:step/start 清空
		retryWindow.entries.push(retryEvent("step/start", { turn: 1, step: 3 }));
		if (retryNotify) retryNotify();
		window.__RETRY_STEP__ = 2;
		finalize();
		return;
	}
	R("step/start 后徽标消失(不残留过期次数)", !badgeVisible(), "badge=" + JSON.stringify(badgeText()));
	R("徽标消失后状态行文案仍在", lineText() === phrase || visiblePhraseOld() === phrase, "line=" + lineText() + " old=" + visiblePhraseOld());
	finalize();
	};

	const check = () => {
		window.__RESULTS__ = window.__RESULTS__.filter((r) => r.name === "apply 不抛异常");
		const phrase = PHRASES[scenario.expectPhase];

		// ══ 观测通道场景(重试徽标 / 无事件流降级):新旧宿主都要覆盖,先于下面分流 ══
		if (scenario.retry) {
			checkObservation(phrase);
			return;
		}

		if (scenario.legacy) {
			// 旧宿主:状态行本来就在旧位置,插件只替换文字(这次改动不能弄坏它)
			const old = viewArea.querySelector(".EvIC1a_turnStatus");
			const oldClock = old && old.querySelector(".EvIC1a_turnStatusClock");
			R("旧宿主仍被接管(.dsh-status-rotator-host)", !!old && old.classList.contains("dsh-status-rotator-host"), old ? old.className : "no host");
			R("旧宿主显示本插件文案", (() => { const s = old && old.querySelector(":scope > .dsh-status-rotator-text"); return !!s && s.textContent === phrase; })(),
				"text=" + (old ? old.textContent : null));
			R("旧宿主的时钟子元素仍在(未被吞掉)", !!oldClock && String(oldClock.textContent || "").length > 0, "clock=" + (oldClock ? oldClock.textContent : null));
			R("旧宿主不额外插入状态行", lineEl() === null);
			if (scenario.summaryHeader) {
				// 0.1.5 共存:折叠头 label 是计数摘要,插件既不该接管它、也不该藏它
				R("0.1.5 共存:计数摘要折叠头不被接管/不隐藏", !!headerButton && getComputedStyle(headerButton).display !== "none"
					&& !headerButton.classList.contains("dsh-status-rotator-host")
					&& headerButton.textContent.indexOf("6 tool calls") === 0,
					headerButton ? "display=" + getComputedStyle(headerButton).display + " text=" + headerButton.textContent : "no button");
				R("0.1.5 共存:状态行仍只在旧位置一处", lineEl() === null && viewArea.querySelectorAll(".dsh-status-rotator-text").length === 1,
					"textSpans=" + viewArea.querySelectorAll(".dsh-status-rotator-text").length);
			}
			finalize();
			return;
		}

		const line = lineEl();
		const clockSpan = line ? line.querySelector(".dsh-status-rotator-clock") : null;
		// host 模式 / 无文案来源时,期望文案是宿主原文(deep diving),不是短语
		const expectedLineText = scenario.hostTextOnly ? hostText.plain : phrase;
		if (scenario.noSeat) {
			// 降级:找不到输入框座位时,不能把宿主的运行中状态藏掉、也不该硬插状态行
			R("座位缺失时不插状态行", line === null);
			R("座位缺失时不藏折叠头(宿主状态仍在)", !!headerButton && getComputedStyle(headerButton).display !== "none"
				&& headerButton.textContent.indexOf(hostText.running("")) === 0,
				headerButton ? "display=" + getComputedStyle(headerButton).display + " text=" + headerButton.textContent : "no button");
			R("座位缺失时读屏公告也不动", textOf("#announce") === hostText.plain, "announce=" + textOf("#announce"));
			finalize();
			return;
		}

		if (testCase === "finished") {
			// 回合结束后:状态行撤掉、折叠头放出来显示宿主结束文案
			R("回合结束后状态行被撤掉", line === null);
			R("折叠头恢复显示", !!headerButton && getComputedStyle(headerButton).display !== "none",
				headerButton ? "display=" + getComputedStyle(headerButton).display : "no button");
			R("结束文案重新可见", !!reactLabelEl && /^Took /.test(reactLabelEl.textContent || ""), "text=" + (reactLabelEl ? reactLabelEl.textContent : null));
			finalize();
			return;
		}

		// ① 位置:状态行插在输入框座位第一位 = 对话下方、输入框上方
		R("状态行插在输入框座位第一位", !!line && !!seatEl && seatEl.firstElementChild === line,
			line ? "seat.first=" + String(seatEl.firstElementChild.className) : "no line");
		R("状态行在输入卡片之前(对话下方 / 输入框上方)", (() => {
			if (!line || !seatEl) return false;
			const card = seatEl.querySelector("#card");
			return !!card && (line.compareDocumentPosition(card) & Node.DOCUMENT_POSITION_FOLLOWING) !== 0;
		})());
		R("状态行与消息列同一左边界(旧版对齐)", (() => {
			if (!line || !seatEl) return false;
			const seatRect = seatEl.getBoundingClientRect();
			const flowRect = document.querySelector("[data-chat-flow-kind]").getBoundingClientRect();
			const wantLeft = Math.round(flowRect.left - seatRect.left);
			const got = Math.round(parseFloat(line.style.paddingLeft || "0"));
			return Math.abs(got - wantLeft) <= 1;
		})(), (() => {
			if (!line || !seatEl) return "no line";
			const seatRect = seatEl.getBoundingClientRect();
			const flowRect = document.querySelector("[data-chat-flow-kind]").getBoundingClientRect();
			return "paddingLeft=" + line.style.paddingLeft + " want=" + Math.round(flowRect.left - seatRect.left);
		})());

		// ② 内容:显示本插件文案,且宿主整段重写之后仍在
		R("可见文案正确(" + (scenario.hostTextOnly ? "宿主原文" : "插件短语") + ")", lineText() === expectedLineText, "text=" + lineText());
		R("宿主已整段重写 ≥2 次(重写没影响状态行)", rewriteCount >= 2, "rewrites=" + rewriteCount);
		R("时钟 span 在状态行上", lineClock() !== null);
		const expectedSec = scenario.startSec + Math.floor((Date.now() - mountedAt) / 1000);
		R("时钟显示宿主时长文本", /^(\d+(秒|s)|\d+m \d+s|\d+分\d+秒)$/.test(String(lineClock() || "")), "clock=" + lineClock());
		R("时钟与宿主一致(±1 秒)", Math.abs(secondsOf(lineClock()) - expectedSec) <= 1,
			"clock=" + lineClock() + " → " + secondsOf(lineClock()) + "s, host=" + expectedSec + "s");

		// ③ 折叠头藏起来(避免同一状态出现两处),但仍在被宿主每秒重写
		R("回合折叠头被藏起来", !!headerButton && getComputedStyle(headerButton).display === "none",
			headerButton ? "display=" + getComputedStyle(headerButton).display : "no button");
		R("折叠头标签仍在被宿主重写(读时长的来源)", !!reactLabelEl && reactLabelEl.textContent.indexOf(hostText.running("")) === 0,
			reactLabelEl ? "text=" + reactLabelEl.textContent : "no label");
		R("读屏公告 span 未被接管(仍原样)", textOf("#announce") === hostText.plain, "announce=" + textOf("#announce"));

		// ④ 阶段分组(host 模式没有短语可轮换,文案与阶段无关 → 只断言文案仍是宿主原文)
		if (scenario.hostTextOnly) {
			R("host 模式:阶段变化不影响文案(始终宿主原文)", lineText() === hostText.plain, "got=" + lineText());
		} else {
			R("阶段分组正确(" + scenario.expectPhase + ")", lineText() === phrase, "expect=" + phrase + " got=" + lineText());
		}

		// ⑤ dsh 0.1.7-rc.1:回合行对每个回合都渲染(!foldable 时 data-open + disabled、无 chevron),
		//    插件必须照样接管 —— 这是 rc.1 相对 alpha 的行为差异,回归要锁死。
		if (scenario.rcSimpleTurn) {
			R("rc.1 简回合:宿主按钮确实是 disabled + data-open + 无 chevron(夹具保真)",
				!!headerButton && headerButton.disabled === true && headerButton.hasAttribute("data-open")
				&& headerButton.querySelectorAll("[aria-hidden='true']").length === 0,
				headerButton ? "disabled=" + headerButton.disabled + " open=" + headerButton.hasAttribute("data-open") : "no button");
			R("rc.1 简回合:照样被接管并藏起来", !!headerButton && getComputedStyle(headerButton).display === "none"
				&& getComputedStyle(headerButton).height === "33px",
				headerButton ? "display=" + getComputedStyle(headerButton).display : "no button");
			R("rc.1 简回合:状态行仍在输入框上方、文案与时钟都对",
				lineText() === phrase && lineClock() !== null,
				"line=" + lineText() + " clock=" + lineClock());
		}

		// ⑥ deep diving 回归:host 模式 / 无文案来源时,插件自己那条线必须是宿主原文
		if (scenario.hostTextOnly) {
			R("状态行文案 = 宿主原文(deep diving),不是空行也不是短语",
				lineText() === hostText.plain, "line=" + JSON.stringify(lineText()));
			R("没有出现轮换短语", lineText() !== PHRASES.running && lineText() !== PHRASES.thinking && lineText() !== PHRASES.long,
				"line=" + lineText());
			R("状态行不是空的(修复「deep diving 不见了」)", typeof lineText() === "string" && lineText().length > 0, "line=" + JSON.stringify(lineText()));
		}

		// ⑦ 纯 0.1.6 观感:与页面里那份 0.1.6 原文参考元素逐项比对 computed style
		if (scenario.reference196) {
			const ref = document.getElementById("ref196");
			const refClock = ref && ref.querySelector(".EvIC1a_turnStatusClock");
			const clock = line && line.querySelector(".dsh-status-rotator-clock");
			const cmp = (el, other, props) => {
				if (!el || !other) return { ok: false, diff: "missing element" };
				const a = getComputedStyle(el), b = getComputedStyle(other);
				const bad = props.filter((p) => a[p] !== b[p]).map((p) => p + ":" + a[p] + "≠" + b[p]);
				return { ok: bad.length === 0, diff: bad.join(", ") };
			};
			// 文本本体的外观:字体简写(族/字重/字号/行高)、盒高、display、渐变文字与动画。
			// 不比对 backgroundPosition:两条线都在跑 shimmer 动画,取到的都是动画中间值,
			// 同一时刻必然不同(两边各自从 100% 0 起步);渐变几何由 backgroundImage /
			// backgroundSize 与同一套关键帧(0 0)覆盖。
			const lineCmp = cmp(line, ref, ["fontFamily", "fontWeight", "fontSize", "lineHeight", "height", "display",
				"alignItems", "whiteSpace", "backgroundImage", "backgroundSize", "backgroundClip",
				"webkitTextFillColor", "animationDuration", "animationTimingFunction", "animationIterationCount"]);
			R("0.1.6 还原:状态行外观与旧版 .turnStatus 逐项一致", lineCmp.ok, lineCmp.diff);
			// 字重必须是 500(--dsw-font-s-strong-14),不是插件以前硬编码的 600
			R("0.1.6 还原:字重 = 500(旧版 --dsw-font-s-strong-14)", line && getComputedStyle(line).fontWeight === "500",
				line ? "fontWeight=" + getComputedStyle(line).fontWeight : "no line");
			const clockCmp = cmp(clock, refClock, ["fontFamily", "fontWeight", "fontSize", "lineHeight", "color",
				"webkitTextFillColor", "marginLeft", "fontVariantNumeric"]);
			R("0.1.6 还原:时钟外观与旧版 .turnStatusClock 逐项一致", clockCmp.ok, clockCmp.diff);
		}

		// ⑧ 时钟出现时机:0.1.6 是 15 秒后才渲染时钟(showClock = elapsedMs >= 15e3)
		if (scenario.clockGated) {
			R("0.1.6 还原:host 模式下时钟按旧版时机出现(≥15s 才显示)", (() => {
				if (!clockSpan) return false;
				const sec = secondsOf(lineClock());
				const visible = getComputedStyle(clockSpan).display !== "none";
				return sec >= 15 ? visible : !visible;
			})(), "clock=" + lineClock() + " display=" + (clockSpan ? getComputedStyle(clockSpan).display : "?"));
		}
		finalize();
	};

	const finalize = () => {
		try {
			const list = window.__RESULTS__;
			const verdict = (list.length > 0 && list.every((r) => r.pass) ? "ALL-PASS " : "HAS-FAIL ")
				+ list.map((r) => (r.pass ? "PASS " : "FAIL ") + r.name + (r.extra ? " [" + r.extra + "]" : "")).join(" | ");
			document.title = verdict;
			const box = document.getElementById("verdict");
			if (box) box.textContent = verdict;
		} catch (error) {
			document.title = "HARNESS-ERROR " + ((error && error.stack) || error);
		}
	};
	setInterval(check, 500);
</script>
</body>
</html>
