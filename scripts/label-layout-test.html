<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>PENDING</title>
<!--
	状态文案布局回归测试(dev-only,不随 npm 包发布)。

	为什么需要它:下面这几件事只有真浏览器 + 真 CSS 才成立,纯函数测不到:
	  1. 打字机逐字输出会让 inline-flex 宿主每 30ms 变一次宽,紧跟其后的时钟
	     随之左右跳 —— 现在开打前用 canvas 量宽锁住 min-width,打完释放;
	  2. 宿主 .turnStatus 是 26px 高 + nowrap,超长文案会把滚动容器撑出横向
	     滚动条 —— 现在 span 收窄 + 溢出时加 .dsh-status-rotator-clip 做淡出;
	  3. 渐变颜色非法(如注入载荷)时,注入的 background-image 整条会失效,
	     而文字是 color:transparent —— 现在不接管文字,回退宿主自带 shimmer。

	用法(任意 Chromium 内核浏览器,无头即可):
	  msedge --headless=new --disable-gpu --virtual-time-budget=6000 \
	         --dump-dom "file:///<repo>/scripts/label-layout-test.html?case=gradient"
	  case=gradient 渐变正常 / case=inject 配色非法 / case=overflow 超长截断
	  结果写进 window.__RESULTS__ 与 #verdict(插件的「标题」功能会改 <title>,
	  别只看标题)。
-->
<style>
	html, body { height: 100%; margin: 0; background: #151517 }
	#box { width: 600px; padding: 12px }
	#box.narrow { width: 120px }
	/* 复刻 dsh 的 .EvIC1a_turnStatus:26px 高 / nowrap / inline-flex / 自带 shimmer 渐变 */
	#status {
		height: 26px; white-space: nowrap; display: inline-flex; align-items: center;
		font: 500 14px/22px system-ui, "Segoe UI", sans-serif;
		background-image: linear-gradient(90deg, #4d6bfe 0%, #4d6bfe 40%, #b8c6ff 50%, #4d6bfe 60%, #4d6bfe 100%);
		background-size: 250% 100%; background-position: 100% 0;
		-webkit-background-clip: text; background-clip: text;
		color: #0000; -webkit-text-fill-color: transparent;
	}
	#clock { margin-left: 8px; font-size: 13px; color: #888; -webkit-text-fill-color: #888 }
	#verdict { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; background: #000; color: #0f0; font: 12px/1.5 monospace; padding: 4px; white-space: pre-wrap }
</style>
</head>
<body>
<div id="box"><div id="status" role="status" aria-live="polite">Deep diving...<span id="clock" aria-hidden="true">15秒</span></div></div>
<div id="verdict">PENDING</div>
<script>
	const params = new URLSearchParams(location.search);
	const testCase = params.get("case") || "gradient";
	const SHORT = "短句…";
	/** 打字机用例要够长,才能在 250ms 采样点还处于输出中(30ms/字) */
	const TYPING = "正在写代码,顺便测一下打字机的锁宽行为…";
	const LONG = "正在路由 dsh-status-rotator 的布局回归测试非常长的一句文案…";
	const baseConfig = { intervalMs: 1e6, typeSpeedMs: 30, liveTickMs: 0, danmaku: { enabled: false } };
	const seeds = {
		gradient: { config: { ...baseConfig, gradient: { enabled: true, colors: ["#ff5f6d", "#5fd4ff"], speed: 4 } }, phrases: { zh: { thinking: [TYPING], running: [TYPING], long: [TYPING] } } },
		inject: { config: { ...baseConfig, typeSpeedMs: 0, gradient: { enabled: true, colors: ["red;}html{display:none}", "#fff"], speed: 4 } }, phrases: { zh: { thinking: [SHORT], running: [SHORT], long: [SHORT] } } },
		overflow: { config: { ...baseConfig, typeSpeedMs: 0, gradient: { enabled: true, colors: ["#ff5f6d", "#5fd4ff"], speed: 4 } }, phrases: { zh: { thinking: [LONG], running: [LONG], long: [LONG] } } }
	};
	if (testCase === "overflow") document.getElementById("box").className = "narrow";
	// file:// 下 localStorage 会抛 SecurityError,先打桩
	Object.defineProperty(window, "localStorage", {
		configurable: true,
		value: {
			getItem: (k) => (k === "dsh-status-rotator.config" ? JSON.stringify(seeds[testCase]) : null),
			setItem: () => {},
			removeItem: () => {}
		}
	});
	window.__RESULTS__ = [];
	const R = (name, pass, extra) => window.__RESULTS__.push({ name, pass: !!pass, extra: extra || "" });
	window.onerror = (msg, src, line) => { R("运行时异常", false, msg + " @" + line); };
	window.__ModuleLoader__ = {
		load(def) {
			const require = (n) => {
				if (n === "react") {
					return {
						useState: (init) => [typeof init === "function" ? init() : init, () => {}],
						useEffect: () => {},
						useCallback: (fn) => fn,
						useRef: (init) => ({ current: init === undefined ? null : init }),
						createElement: (type, props, ...children) => ({ type, props: props || {}, children })
					};
				}
				throw new Error("unexpected require: " + n);
			};
			window.__PLUGIN__ = def.factory(require);
		}
	};
</script>
<script src="../lib/client.js"></script>
<script>
	let settingsComponent = null;
	const ctx = {
		locale: {
			register: () => () => {},
			subscribe: () => () => {},
			getLocale: () => ({ active: "zh" }),
			bind: () => null
		},
		slots: {
			inject: (name, fn) => fn(),
			register: (def, comp) => { if (typeof comp === "function") settingsComponent = comp; return { dispose() {} }; }
		},
		effect: (cb) => cb(),
		get: () => undefined,
		on: () => {}
	};
	/** 在渲染树里找某个 className(设置页组件是纯 createElement,不依赖 React 运行时) */
	const hasClass = (node, cls) => {
		if (!node || typeof node !== "object") return false;
		if (Array.isArray(node)) return node.some((child) => hasClass(child, cls));
		if (node.props && typeof node.props.className === "string" && node.props.className.split(" ").includes(cls)) return true;
		return hasClass(node.children, cls);
	};
	const statusEl = () => document.getElementById("status");
	const spanEl = () => {
		const el = statusEl();
		return el ? el.querySelector(":scope > .dsh-status-rotator-text") : null;
	};
	let duringTypingMinWidth = null;
	try {
		window.__PLUGIN__.apply(ctx);
		R("apply 不抛异常", true);
	} catch (error) {
		R("apply 不抛异常", false, String((error && error.stack) || error));
	}
	// 打字机进行中采样一次 min-width(锁宽是否生效)
	setTimeout(() => {
		const el = statusEl();
		duringTypingMinWidth = el ? el.style.minWidth : null;
	}, 250);

	// 设置页组件:能渲染出预览卡片,且不抛异常(改设置页 JSX 时最先坏在这里)
	try {
		const tree = settingsComponent ? settingsComponent({ t: (k) => k }) : null;
		R("设置页组件可渲染", !!tree && tree.type === "div");
		R("设置页含实时预览卡片", hasClass(tree, "dsh-sr-previewRow") && hasClass(tree, "dsh-sr-previewDanmaku"));
		R("设置页文案词库排在预设之前", (() => {
			const flat = [];
			const walk = (node) => {
				if (!node || typeof node !== "object") return;
				if (Array.isArray(node)) { node.forEach(walk); return; }
				if (node.type === "h3" && Array.isArray(node.children)) flat.push(String(node.children[0]));
				walk(node.children);
			};
			walk(tree);
			const library = flat.indexOf("library");
			const preset = flat.indexOf("preset");
			return library >= 0 && preset >= 0 && library < preset;
		})());
	} catch (error) {
		R("设置页组件可渲染", false, String((error && error.stack) || error));
	}

	const finalize = () => {
		try {
			const el = statusEl();
			const span = spanEl();
			window.__RESULTS__ = window.__RESULTS__.filter((r) => !r.name.startsWith("断言:"));
			R("断言: 文本被包进 .dsh-status-rotator-text", span !== null);
			R("断言: 宿主加了 .dsh-status-rotator-host", el !== null && el.classList.contains("dsh-status-rotator-host"),
				el ? "class=" + el.className : "no el");
			if (testCase === "gradient") {
				R("断言: 渐变 class 生效", span !== null && span.classList.contains("dsh-status-rotator-rainbow"));
				R("断言: 注入的渐变 CSS 含自定义配色", (() => {
					const css = document.getElementById("dsh-status-rotator-style");
					return !!css && css.textContent.includes("#ff5f6d") && css.textContent.includes("linear-gradient");
				})());
				R("断言: 宿主自带 shimmer 被关掉(避免两层流光)", el !== null && el.classList.contains("dsh-status-rotator-host-gradient"));
				R("断言: 打字期间锁住宽度(时钟不跳)", duringTypingMinWidth !== null && duringTypingMinWidth !== "" && parseFloat(duringTypingMinWidth) > 20,
					"minWidth=" + duringTypingMinWidth);
				R("断言: 打字结束后释放宽度锁", el !== null && el.style.minWidth === "", el ? "minWidth='" + el.style.minWidth + "'" : "");
				R("断言: 短文案不加淡出", span !== null && !span.classList.contains("dsh-status-rotator-clip"));
			}
			if (testCase === "inject") {
				R("断言: 配色非法时不接管文字(无 rainbow)", span !== null && !span.classList.contains("dsh-status-rotator-rainbow"));
				R("断言: 配色非法时不动宿主 shimmer(文字仍可见)", el !== null && !el.classList.contains("dsh-status-rotator-host-gradient")
					&& getComputedStyle(el).backgroundImage !== "none");
				R("断言: 注入的 style 为空", (() => {
					const css = document.getElementById("dsh-status-rotator-style");
					return !css || css.textContent === "";
				})());
			}
			if (testCase === "overflow") {
				R("断言: 超长文案触发淡出 class", span !== null && span.classList.contains("dsh-status-rotator-clip"),
					span ? "scroll=" + span.scrollWidth + " client=" + span.clientWidth : "no span");
				R("断言: 文字盒真的收窄了", span !== null && span.scrollWidth > span.clientWidth);
				R("断言: 不再撑出横向滚动条", (() => {
					const box = document.getElementById("box");
					return box.scrollWidth <= box.clientWidth + 1;
				})(), (() => { const box = document.getElementById("box"); return "box " + box.scrollWidth + "/" + box.clientWidth; })());
				R("断言: 时钟没被挤走", (() => {
					const clock = document.getElementById("clock");
					return !!clock && clock.getBoundingClientRect().width > 0;
				})());
			}
			const title = window.__RESULTS__.map((r) => (r.pass ? "PASS " : "FAIL ") + r.name + (r.extra ? " [" + r.extra + "]" : "")).join(" | ");
			const verdict = (window.__RESULTS__.length > 0 && window.__RESULTS__.every((r) => r.pass) ? "ALL-PASS " : "HAS-FAIL ") + title;
			document.title = verdict;
			const box = document.getElementById("verdict");
			if (box) box.textContent = verdict;
		} catch (error) {
			document.title = "HARNESS-ERROR " + ((error && error.stack) || error);
			const box = document.getElementById("verdict");
			if (box) box.textContent = document.title;
		}
	};
	setInterval(finalize, 500);
</script>
</body>
</html>
