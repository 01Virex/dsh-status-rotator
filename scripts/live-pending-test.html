<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>PENDING</title>
<!--
	{pending} 实时刷新回归测试(dev-only,不随 npm 包发布)。

	为什么需要它:这三点只有把真插件跑起来才成立,纯函数测不到:
	  1. {pending} 的来源是 ctx.uiSession.pendingInteractions(SessionId → 待作答交互),
	     **不是**会话快照 —— dsh 0.1.5 的 SessionSnapshot 已经没有 pending 字段,
	     读快照的旧实现恒为 0;
	  2. 该 map 变化后,已接管的文案必须**立刻**重渲染,而不是等下一次轮换
	     (setLive → 微任务合并 → renderLiveNow → updateTitle);
	  3. 拿不到 uiSession 服务时(旧版 dsh)必须静默保持 0,不能抛错。

	用法(任意 Chromium 内核浏览器,无头即可):
	  msedge --headless=new --disable-gpu --virtual-time-budget=8000 \
	         --dump-dom "file:///<repo>/scripts/live-pending-test.html?case=live"
	  case=live   pending 0 → 1 → 0 全流程 / case=noservice  无 uiSession 服务
	  结果写进 window.__RESULTS__ 与 #verdict(插件的「标题」功能会改 <title>,
	  别只看标题)。npm run test:browser 会连这个页面一起跑。
-->
<style>
	html, body { height: 100%; margin: 0; background: #151517; color: #eee }
	#box { width: 600px; padding: 12px }
	/* 复刻 dsh 的 .turnStatus:26px 高 / nowrap / inline-flex */
	#status {
		height: 26px; white-space: nowrap; display: inline-flex; align-items: center;
		font: 500 14px/22px system-ui, "Segoe UI", sans-serif;
		background-image: linear-gradient(90deg, #4d6bfe 0%, #4d6bfe 40%, #b8c6ff 50%, #4d6bfe 60%, #4d6bfe 100%);
		background-size: 250% 100%; background-position: 100% 0;
		-webkit-background-clip: text; background-clip: text;
		color: #0000; -webkit-text-fill-color: transparent;
	}
	#clock { margin-left: 8px; font-size: 13px; color: #888; -webkit-text-fill-color: #888 }
	#verdict { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; background: #000; color: #0f0; font: 12px/1.5 monospace; padding: 4px; white-space: pre-wrap }
</style>
</head>
<body>
<div id="box"><div id="status" role="status" aria-live="polite">Deep diving...<span id="clock" aria-hidden="true">15秒</span></div></div>
<div id="verdict">PENDING</div>
<script>
	const params = new URLSearchParams(location.search);
	const testCase = params.get("case") || "live";
	/** 文案里必须有动态占位符,否则 isDynamicTemplate 会跳过实时重渲染 */
	const PHRASE = "等待审批中 {pending}…";
	const seeded = JSON.stringify({
		config: {
			intervalMs: 1e6,          // 不轮换:文本变化只可能来自实时刷新
			typeSpeedMs: 0,           // 不打字:变化立即可见
			liveTickMs: 5000,         // 心跳放慢,证明刷新不是靠定时器
			gradient: { enabled: true, colors: ["#ff5f6d", "#5fd4ff"], speed: 4 },
			danmaku: { enabled: false }
		},
		phrases: { zh: { thinking: [PHRASE], running: [PHRASE], long: [PHRASE] } }
	});
	// file:// 下 localStorage 会抛 SecurityError,先打桩
	Object.defineProperty(window, "localStorage", {
		configurable: true,
		value: {
			getItem: (k) => (k === "dsh-status-rotator.config" ? seeded : null),
			setItem: () => {},
			removeItem: () => {}
		}
	});
	window.__RESULTS__ = [];
	const R = (name, pass, extra) => window.__RESULTS__.push({ name, pass: !!pass, extra: extra || "" });
	window.__ModuleLoader__ = {
		load(def) {
			const require = (n) => {
				if (n === "react") {
					return {
						useState: (init) => [typeof init === "function" ? init() : init, () => {}],
						useEffect: () => {},
						useCallback: (fn) => fn,
						useRef: (init) => ({ current: init === undefined ? null : init }),
						createElement: (type, props, ...children) => ({ type, props: props || {}, children })
					};
				}
				throw new Error("unexpected require: " + n);
			};
			window.__PLUGIN__ = def.factory(require);
		}
	};
</script>
<script src="../lib/client.js"></script>
<script>
	const SESSION_ID = "session-1";
	/** 待作答交互表:与 dsh 的 SessionPendingInteractionSnapshot 同形(SessionId → 交互) */
	let pendingMap = new Map();
	const pendingListeners = new Set();
	const pendingSource = {
		getSnapshot: () => pendingMap,
		subscribe: (fn) => { pendingListeners.add(fn); return () => pendingListeners.delete(fn); }
	};
	const publishPending = (map) => {
		pendingMap = map;
		for (const fn of Array.from(pendingListeners)) fn();
	};
	const sessionSnapshot = { running: true, queue: [], pendingSubmissions: [] };
	const sessionFace = {
		getSnapshot: () => sessionSnapshot,
		subscribe: () => () => {}
	};
	const sessions = {
		list: {
			getSnapshot: () => ({ current: SESSION_ID }),
			subscribe: () => () => {}
		},
		binding: (id) => (String(id) === SESSION_ID ? { session: sessionFace } : undefined)
	};

	// ctx.get 按名字取服务(插件用可选服务访问,不写进 inject)
	const services = { sessions };
	// case=noservice:模拟旧版 dsh —— 没有 uiSession,插件必须静默保持 0
	if (testCase !== "noservice") services.uiSession = { pendingInteractions: pendingSource };

	const ctx = {
		locale: {
			register: () => () => {},
			subscribe: () => () => {},
			getLocale: () => ({ active: "zh" }),
			bind: () => null
		},
		slots: { inject: (name, fn) => fn(), register: () => ({ dispose() {} }) },
		effect: (cb) => cb(),
		get: (name) => services[name],
		on: () => {}
	};
	// 两条取服务的路径都铺上:cordis 服务既可能走 ctx.get("x"),也可能直接挂在
	// ctx.x 上(插件的 access() 依次尝试这两种),别让回归页只覆盖其中一条。
	for (const [name, value] of Object.entries(services)) {
		if (ctx[name] === undefined) ctx[name] = value;
	}

	const statusEl = () => document.getElementById("status");
	/** 标签可见文本(去掉时钟那段),例:"等待审批中 1…" */
	const labelText = () => {
		const el = statusEl();
		if (!el) return null;
		const clock = document.getElementById("clock");
		const full = el.textContent || "";
		const clockText = clock ? (clock.textContent || "") : "";
		return clockText ? full.replace(clockText, "") : full;
	};
	/** 从文案里抠出 {pending} 渲染出的数字 */
	const pendingShown = () => {
		const text = labelText();
		if (text === null) return null;
		const m = text.match(/等待审批中\s*(-?\d+)/);
		return m ? m[1] : null;
	};

	try {
		window.__PLUGIN__.apply(ctx);
		R("apply 不抛异常", true);
	} catch (error) {
		R("apply 不抛异常", false, String((error && error.stack) || error));
	}

	window.onerror = (msg, src, line) => { R("运行时异常", false, msg + " @" + line); };

	// 记录 {pending} 的每一次 DOM 变化:用来证明「立刻重渲染」而不是「等到下一次轮换」
	const seen = [];
	if (statusEl()) {
		new MutationObserver(() => {
			const shown = pendingShown();
			if (shown !== null && seen[seen.length - 1] !== shown) seen.push(shown);
		}).observe(statusEl(), { subtree: true, characterData: true, childList: true });
	}

	const steps = [];
	const step = (name, fn) => steps.push({ name, fn });
	// 1) 初始:没有任何待作答交互
	step("初始 {pending} = 0", () => {
		pendingShown();
	});
	// 2) ask 策略下的审批等待:面板发布一条待作答交互 → 立刻变 1
	step("审批等待中 → 1", () => {
		publishPending(new Map([[SESSION_ID, { key: "k1", kind: "approval", sessionId: SESSION_ID }]]));
	});
	// 3) 面板关闭/被拒绝 → 回到 0(never 策略下审批根本不会进入这张表)
	step("面板关闭 → 0", () => {
		publishPending(new Map());
	});
	// 4) 提问面板与策略无关,照样计数
	step("提问等待中 → 1", () => {
		publishPending(new Map([[SESSION_ID, { key: "k2", kind: "question", sessionId: SESSION_ID }]]));
	});

	let index = 0;
	const runSteps = () => {
		if (index >= steps.length) return;           // 跑完后交给 finalize 断言
		const current = steps[index++];
		try {
			current.fn();
		} catch (error) {
			R("步骤 " + current.name + " 抛异常", false, String((error && error.stack) || error));
		}
		setTimeout(runSteps, 120);
	};
	setTimeout(runSteps, 500);   // 先让插件接管标签、连上会话

	const finalize = () => {
		try {
			window.__RESULTS__ = window.__RESULTS__.filter((r) => !r.name.startsWith("断言:"));
			const span = statusEl() ? statusEl().querySelector(":scope > .dsh-status-rotator-text") : null;
			R("断言: 标签已被插件接管", span !== null, statusEl() ? "class=" + statusEl().className : "no el");
			if (testCase === "noservice") {
				R("断言: 无 uiSession 服务时 {pending} = 0", pendingShown() === "0", "shown=" + pendingShown());
				R("断言: 无 uiSession 服务时不抛异常", !window.__RESULTS__.some((r) => !r.pass && /异常/.test(r.name)));
			} else {
				R("断言: {pending} 依次经历 0 → 1 → 0 → 1", seen.join(",") === "0,1,0,1", "seen=" + JSON.stringify(seen));
				R("断言: 最终仍显示 1(提问等待中)", pendingShown() === "1", "shown=" + pendingShown());
				R("断言: 变化不止一次(实时刷新真的在跑)", seen.length >= 4, "n=" + seen.length);
			}
			const title = window.__RESULTS__.map((r) => (r.pass ? "PASS " : "FAIL ") + r.name + (r.extra ? " [" + r.extra + "]" : "")).join(" | ");
			const verdict = (window.__RESULTS__.length > 0 && window.__RESULTS__.every((r) => r.pass) ? "ALL-PASS " : "HAS-FAIL ") + title;
			document.title = verdict;
			const box = document.getElementById("verdict");
			if (box) box.textContent = verdict;
		} catch (error) {
			document.title = "HARNESS-ERROR " + ((error && error.stack) || error);
			const box = document.getElementById("verdict");
			if (box) box.textContent = document.title;
		}
	};
	setInterval(finalize, 500);
</script>
</body>
</html>
