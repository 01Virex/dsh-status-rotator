<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>PENDING</title>
<!--
	(视觉主题化)+ (弹幕增强)的浏览器回归页(dev-only,不随 npm 包发布)。

	为什么需要真浏览器:每一项都是**落到 CSS 上**的(字体 / 字号 / 发光 / 动画 / 活动指示),
	前两项是**指针交互**(悬停冻结、点击复制)—— 类名有没有加上、::before 有没有真的渲染、
	点击有没有走到剪贴板,纯函数都测不到。

	用例:
	  ?case=default  默认值 = 什么都不改(升级不改变观感;弹幕层不接指针)
	  ?case=theme    主题包(霓虹):外观 + 渐变色板一次生效
	  ?case=interact 悬停暂停 + 点击复制 + 按相位分色
	  ?case=send     api.sendDanmaku():立刻发一条自己的弹幕
	  结果写进 window.__RESULTS__,并置 window.__RESULTS_DONE__ 供运行器等待。
-->
<style>
	html, body { height: 100%; margin: 0; background: #151517; color: #ddd }
	#box { width: 600px; padding: 12px }
	#status {
		height: 26px; white-space: nowrap; display: inline-flex; align-items: center;
		font: 500 14px/22px system-ui, "Segoe UI", sans-serif;
		background-image: linear-gradient(90deg, #4d6bfe 0%, #4d6bfe 40%, #b8c6ff 50%, #4d6bfe 60%, #4d6bfe 100%);
		background-size: 250% 100%; background-position: 100% 0;
		-webkit-background-clip: text; background-clip: text;
		color: #0000; -webkit-text-fill-color: transparent;
	}
	#clock { margin-left: 8px; font-size: 13px; color: #888; -webkit-text-fill-color: #888 }
	#verdict { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; background: #000; color: #0f0; font: 12px/1.5 monospace; padding: 4px; white-space: pre-wrap }
</style>
</head>
<body>
<div id="box"><div id="status" role="status" aria-live="polite">Deep diving...<span id="clock" aria-hidden="true">15秒</span></div></div>
<div id="verdict">PENDING</div>
<script>
	const params = new URLSearchParams(location.search);
	const testCase = params.get("case") || "default";
	/** 每个用例一份配置:弹幕间隔压到很短,好在等待窗口内拿到弹幕 */
	const base = { intervalMs: 1e6, typeSpeedMs: 0, liveTickMs: 0, title: { enabled: false } };
	/** 必须给词库:外观挂在插件自己的文本 span 上,弹幕池也来自词库 */
	const PHRASES = { zh: { thinking: ["用例文案甲…"], running: ["用例文案乙…"], long: ["用例文案丙…"] }, en: { thinking: ["case line A..."] } };
	const dmBase = { enabled: true, intervalMs: 120, speedMs: 60000, maxCount: 8, opacity: 0.6, fontSizeMin: 14, fontSizeMax: 14 };
	const SEEDS = {
		default: { config: { ...base, danmaku: { ...dmBase } }, phrases: PHRASES },
		theme: {
			config: {
				...base,
				danmaku: { ...dmBase },
				appearance: { fontFamily: "ui-monospace, monospace", fontSize: 15, glow: true, glowColor: "#5fd4ff", animation: "breathe", spinner: "ring" },
				gradient: { enabled: true, mode: "night", direction: "rtl", colors: ["#22d3ee", "#a78bfa", "#f472b6"], speed: 3 },
			},
		},
		interact: {
			config: {
				...base,
				danmaku: { ...dmBase, hoverPause: true, clickCopy: true, phaseColors: { thinking: "#00ff00", running: "#00ff00", long: "#00ff00" } },
			},
		},
		send: { config: { ...base, danmaku: { ...dmBase, intervalMs: 1e6 } } },
	};
	const seed = SEEDS[testCase] || SEEDS.default;
	if (!seed.phrases) seed.phrases = PHRASES;
	Object.defineProperty(window, "localStorage", {
		configurable: true,
		value: { getItem: (k) => (k === "dsh-status-rotator.config" ? JSON.stringify(seed) : null), setItem: () => {}, removeItem: () => {} }
	});
	window.__RESULTS__ = [];
	window.__RESULTS_DONE__ = false;
	const R = (name, pass, extra) => window.__RESULTS__.push({ name, pass: !!pass, extra: extra || "" });
	window.onerror = (msg, src, line) => { R("运行时异常", false, msg + " @" + line); };
	/** 剪贴板桩:点击复制的断言靠它 */
	window.__COPIED__ = [];
	Object.defineProperty(navigator, "clipboard", {
		configurable: true,
		value: { writeText: (text) => { window.__COPIED__.push(String(text)); return Promise.resolve(); } }
	});
	window.__ModuleLoader__ = {
		load(def) {
			const require = (n) => {
				if (n === "react") {
					return {
						useState: (init) => [typeof init === "function" ? init() : init, () => {}],
						useEffect: () => {}, useCallback: (fn) => fn,
						useRef: (init) => ({ current: init === undefined ? null : init }),
						createElement: (type, props, ...children) => ({ type, props: props || {}, children })
					};
				}
				throw new Error("unexpected require: " + n);
			};
			window.__PLUGIN__ = def.factory(require);
		}
	};
</script>
<script src="../lib/client.js"></script>
<script>
	const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
	const statusEl = () => document.getElementById("status");
	const textSpan = () => {
		const el = statusEl();
		return el ? el.querySelector(":scope > .dsh-status-rotator-text") : null;
	};
	const layer = () => document.querySelector(".dsh-status-rotator-danmaku-layer");
	const items = () => Array.from(document.querySelectorAll(".dsh-status-rotator-danmaku-item"));
	const POINTER = "dsh-status-rotator-danmaku-pointer";

	const provided = {};
	const ctx = {
		locale: { register: () => () => {}, subscribe: () => () => {}, getLocale: () => ({ active: "zh" }), bind: () => null },
		slots: { inject: () => {}, register: () => ({ dispose() {} }) },
		effect: (cb) => cb(),
		get: (name) => provided[name],
		on: () => {},
		provide: (name, value) => { provided[name] = value; return () => { delete provided[name]; }; }
	};

	let finished = false;
	(async () => {
		try {
			await run();
			R("用例跑完", true);
		} catch (error) {
			R("用例跑完", false, String((error && error.stack) || error));
		}
		finished = true;
		const failed = window.__RESULTS__.filter((r) => !r.pass);
		const box = document.getElementById("verdict");
		if (box) box.textContent = (failed.length === 0 ? "全部通过" : failed.length + " 项失败") + "\n"
			+ window.__RESULTS__.map((r) => (r.pass ? "✓ " : "✗ ") + r.name + (r.extra ? " [" + r.extra + "]" : "")).join("\n");
		document.title = failed.length === 0 ? "PASS" : "FAIL";
		window.__RESULTS_DONE__ = true;
	})();

	async function run() {
		try {
			window.__PLUGIN__.apply(ctx);
			R("apply 不抛异常", true);
		} catch (error) {
			R("apply 不抛异常", false, String((error && error.stack) || error));
		}
		await sleep(900);   // 等采纳状态行 + 建弹幕层

		const span = textSpan();
		R("状态行文本 span 存在(外观都挂在它上面)", !!span);

		if (testCase === "default") {
			R("默认不设字体族", !statusEl().style.fontFamily, statusEl().style.fontFamily || "(空)");
			R("默认不设字号", !statusEl().style.fontSize, statusEl().style.fontSize || "(空)");
			R("默认不加动画 / 发光 / 指示类", span && !span.className.includes("anim-") && !span.className.includes("glow") && !span.className.includes("spin-"), span ? span.className : "(无 span)");
			R("默认弹幕层不接指针", layer() !== null && !layer().className.includes(POINTER), layer() ? layer().className : "(无层)");
			return;
		}

		if (testCase === "theme") {
			R("字体族落到了状态行上", String(statusEl().style.fontFamily).includes("ui-monospace"), statusEl().style.fontFamily);
			R("字号落到了状态行上", statusEl().style.fontSize === "15px", statusEl().style.fontSize);
			R("发光类 + 发光色变量", span.classList.contains("dsh-status-rotator-glow") && span.style.getPropertyValue("--dsh-sr-glow") === "#5fd4ff", span.style.getPropertyValue("--dsh-sr-glow"));
			R("呼吸动画类", span.classList.contains("dsh-status-rotator-anim-breathe"));
			R("环形活动指示:类 + ::before 真的渲染", span.classList.contains("dsh-status-rotator-spin-ring")
				&& getComputedStyle(span, "::before").content !== "none",
				"content=" + getComputedStyle(span, "::before").content);
			R("指示器强调色跟着发光色", span.style.getPropertyValue("--dsh-sr-accent") === "#5fd4ff", span.style.getPropertyValue("--dsh-sr-accent"));
			R("主题的渐变色板也生效", (getComputedStyle(span).backgroundImage || "").includes("34, 211, 238") || (getComputedStyle(span).backgroundImage || "").includes("#22d3ee") || (getComputedStyle(span).backgroundImage || "").includes("rgb"), getComputedStyle(span).backgroundImage.slice(0, 60));
			return;
		}

		if (testCase === "interact") {
			R("弹幕层接指针(显式打开后才加类)", layer() !== null && layer().className.includes(POINTER), layer() ? layer().className : "(无层)");
			R("弹幕条目本身可以被点(pointer-events:auto)",
				items().length > 0 && getComputedStyle(items()[0]).pointerEvents === "auto",
				items().length > 0 ? getComputedStyle(items()[0]).pointerEvents : "(没有弹幕)");
			// 按相位分色:配置里三个相位都是 #00ff00,弹幕颜色应等于它(rgb(0, 255, 0))
			R("按相位分色生效", items().length > 0 && getComputedStyle(items()[0]).color === "rgb(0, 255, 0)", items().length > 0 ? getComputedStyle(items()[0]).color : "(没有弹幕)");
			// 悬停冻结:记下 transform,派发 pointerover,位置应被钉住(transition 变 none)
			if (items().length > 0) {
				const el = items()[0];
				el.dispatchEvent(new PointerEvent("pointerover", { bubbles: true }));
				await sleep(80);
				R("悬停后这一颗被冻住(transition:none 且位置固定)", el.style.transition === "none", "transition=" + (el.style.transition || "(空)"));
				const frozen = el.style.transform;
				await sleep(200);
				R("冻住期间位置不再变化", el.style.transform === frozen, frozen);
				el.dispatchEvent(new PointerEvent("pointerout", { bubbles: true }));
				await sleep(80);
				R("移开后恢复过渡", el.style.transition.includes("linear"), el.style.transition);
			}
			// 点击复制
			if (items().length > 0) {
				const el = items()[0];
				const text = String(el.textContent || "");
				el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
				await sleep(60);
				R("点击弹幕把文案写进剪贴板", window.__COPIED__.includes(text), "copied=" + JSON.stringify(window.__COPIED__) + " text=" + text.slice(0, 20));
				R("点击后有一次短暂反馈", el.classList.contains("dsh-status-rotator-danmaku-copied"));
			}
			return;
		}

		if (testCase === "send") {
			const api = provided.statusRotator;
			R("拿到注册接口(自己发一条挂在它上面)", !!api && typeof api.sendDanmaku === "function");
			const sent = api.sendDanmaku("自己发的一条…");
			await sleep(120);
			R("sendDanmaku 返回 true(层在,当场发出)", sent === true, "sent=" + sent);
			R("自己发的那条真的出现在页面上", items().some((el) => String(el.textContent).includes("自己发的一条")),
				items().map((el) => String(el.textContent).slice(0, 12)).join(" / "));
			R("空文案被拒(不产生弹幕)", api.sendDanmaku("   ") === false);
			return;
		}
	}
</script>
</body>
</html>
